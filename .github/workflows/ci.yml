name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '29.0'
          elixir-version: '1.20'

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      # Dialyzer's PLT takes minutes to build, so it is cached per
      # OTP/Elixir version and rebuilt only when dependencies change
      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp29.0-elixir1.20-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-otp29.0-elixir1.20-

      - name: Build Dialyzer PLT
        run: mix dialyzer --plt

      - name: Check code quality
        run: mix quality

  tests:
    # Pinned: Hex has no OTP 25.0 build for ubuntu-26.04 (ubuntu-latest)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.14'
            otp: '25.0'
          - elixir: '1.18'
            otp: '27.0'
          - elixir: '1.20'
            otp: '29.0'

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check compilation warnings
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
