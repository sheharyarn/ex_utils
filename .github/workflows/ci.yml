name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      OTP_VERSION: '29.0'
      ELIXIR_VERSION: '1.20'

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Restore Dialyzer PLT cache
        uses: actions/cache@v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-otp${{ env.OTP_VERSION }}-elixir${{ env.ELIXIR_VERSION }}-

      - name: Build Dialyzer PLT
        run: mix dialyzer --plt

      - name: Check code quality
        run: mix quality

  tests:
    # Pinned: Hex has no OTP 25.0 build for ubuntu-26.04 (ubuntu-latest)
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.14'
            otp: '25.0'
          - elixir: '1.18'
            otp: '27.0'
          - elixir: '1.20'
            otp: '29.0'

    steps:
      - uses: actions/checkout@v5
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check compilation warnings
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test
